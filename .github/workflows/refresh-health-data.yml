name: Refresh Health Data

# MANUAL ONLY as of 2026-07-30. Do not restore the `schedule:` block.
#
# This job used to run every 6 hours against Zepp / Cronometer / Notion.
# Zepp was retired 2026-07-27 -- its login flow invalidates Eddie's phone
# session and signs him out of the Zepp app -- and this runner was the last
# live Zepp caller in the system, missed because it runs in the cloud rather
# than on EDWIN. The Zepp secrets are gone from this file; the body data now
# comes from Apple Health / Health Auto Export, built on EDWIN.
#
# It also re-authenticated to Cronometer with email+password on every run.
# Cronometer logins are account-throttled and shared across hosts, so a cloud
# job logging in 4x/day competes with the local MCP for the same session.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build data.json but skip the commit'
        required: false
        type: boolean
        default: false
      sections:
        description: 'Sections preset (full/fast/nutrition) or comma list'
        required: false
        type: string
        default: 'nutrition'

permissions:
  contents: write   # required so the job can commit back to main

concurrency:
  group: refresh-health-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          # Extra deps required by the vendored MCP modules (kept out of
          # requirements.txt because the local MCPs have their own install):
          pip install pycryptodome mcp

      - name: Build data.json
        env:
          CRONOMETER_EMAIL:         ${{ secrets.CRONOMETER_EMAIL }}
          CRONOMETER_PASSWORD:      ${{ secrets.CRONOMETER_PASSWORD }}
          CRONOMETER_TARGET_KCAL:   ${{ vars.CRONOMETER_TARGET_KCAL }}
          CRONOMETER_TARGET_PROTEIN_G: ${{ vars.CRONOMETER_TARGET_PROTEIN_G }}
          NOTION_TOKEN:             ${{ secrets.NOTION_TOKEN }}
          NOTION_WORKOUT_DB_ID:     ${{ secrets.NOTION_WORKOUT_DB_ID }}
          NOTION_SUPPLEMENT_DB_ID:  ${{ secrets.NOTION_SUPPLEMENT_DB_ID }}
          REFRESH_ENDPOINT:         ${{ vars.REFRESH_ENDPOINT }}
        run: |
          python scripts/build_data.py health/widgets/data/data.json --sections "${{ inputs.sections || 'nutrition' }}"
        continue-on-error: true   # let us commit a partial update if 1 source dies

      - name: Show updated payload (head)
        run: head -c 2000 health/widgets/data/data.json

      - name: Commit & push
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain health/widgets/data/data.json)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/widgets/data/data.json
          git commit -m "chore(health): refresh data.json [skip ci]"
          git push
