<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:380px;overflow:hidden;background:#191919;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
  body{display:flex;flex-direction:column;padding:16px 18px 12px}
  .stats-heading{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.35);margin-bottom:14px}
  .today-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .val{font-size:26px;font-weight:800;color:#f0f0f0;line-height:1}
  .stat .val.orange{color:#e8943a}
  .stat .val.green{color:#6bda87}
  .stat .lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:rgba(255,255,255,.35)}
  .divider{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .day-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
  .day-lbl{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase}
  .day-lbl.today{color:#e8943a}
  .bar-track{width:100%;height:52px;background:rgba(255,255,255,.05);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
  .bar-fill{width:100%;border-radius:4px 4px 0 0}
  .bar-fill.today-bar{background:rgba(232,148,58,.90)}
  .bar-fill.normal-bar{background:rgba(184,88,32,.65)}
  .bar-fill.empty-bar{background:transparent}
  .step-val{font-size:7px;color:rgba(255,255,255,.3);text-align:center}
  .rhr-val{font-size:10.5px;font-weight:700;text-align:center}
  .rhr-val.low{color:#6bda87}.rhr-val.norm{color:rgba(255,255,255,.65)}.rhr-val.high{color:#e8943a}
  .workout-strip{background:rgba(232,148,58,.08);border-left:3px solid #e8943a;border-radius:0 6px 6px 0;padding:8px 12px;margin-top:12px;display:flex;align-items:center;gap:8px}
  .workout-strip .wlbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#e8943a;flex-shrink:0}
  .workout-strip .wval{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
  .dot{color:rgba(255,255,255,.2);margin:0 4px}
</style></head><body>
<div class="stats-heading">Today</div>
<div class="today-row">
  <div class="stat"><span class="val orange">51</span><span class="lbl">RHR bpm</span></div>
  <div class="stat"><span class="val orange">228</span><span class="lbl">Steps</span></div>
  <div class="stat"><span class="val orange">60</span><span class="lbl">Avg HR</span></div>
  <div class="stat"><span class="val">100</span><span class="lbl">Sleep score</span></div>
</div>
<div class="divider"></div>
<div class="week-grid" id="grid"></div>

<script>
const days=["Thu", "Fri", "Sat", "Sun", "Mon", "Tue", "Wed"];
const steps=[10812, 6374, 4046, 9826, 5938, 4552, 228];
const rhr=[54, 54, 51, 54, 55, 52, 51];
// filter(Boolean) over an all-null week yields Math.max() === -Infinity, which
// makes every height NaN and the grid render empty with no hint why.
const vals=steps.filter(v=>typeof v==='number'&&v>0);
const max=vals.length?Math.max(...vals):0;
const grid=document.getElementById('grid');
days.forEach((d,i)=>{
  // The window always ends on today, so today is the last slot by construction.
  const isToday=i===days.length-1,hasData=steps[i]!==null&&steps[i]!==undefined;
  const pct=(hasData&&max>0)?(steps[i]/max*100).toFixed(1):0;
  let rhrClass='norm';
  if(hasData)rhrClass=rhr[i]<=53?'low':rhr[i]>=58?'high':'norm';
  const cell=document.createElement('div');
  cell.className='day-cell';
  cell.innerHTML=`<div class="day-lbl${isToday?' today':''}">${d}</div>
    <div class="bar-track"><div class="bar-fill ${isToday?'today-bar':hasData?'normal-bar':'empty-bar'}" style="height:${pct}%"></div></div>
    <div class="step-val">${hasData?(steps[i]/1000).toFixed(1)+'k':'—'}</div>
    <div class="rhr-val ${rhrClass}">${hasData?rhr[i]:'—'}</div>`;
  grid.appendChild(cell);
});
</script>

<button id="rlbtn" title="Reload latest published data" aria-label="Reload">&#8635;</button>
<style>
  body{position:relative}
  #rlbtn{position:absolute;top:9px;right:11px;z-index:20;width:21px;height:21px;
    padding:0;border:0;border-radius:50%;cursor:pointer;font-size:12px;line-height:21px;
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.38);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    transition:background .15s,color .15s}
  #rlbtn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
  #rlbtn.spin{animation:rlspin .7s linear infinite}
  @keyframes rlspin{to{transform:rotate(360deg)}}
</style>
<script>
document.getElementById('rlbtn').addEventListener('click', function () {
  this.classList.add('spin');
  location.replace(location.pathname + '?t=' + Date.now());
});
</script>
</body></html>
