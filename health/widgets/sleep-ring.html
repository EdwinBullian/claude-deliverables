<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:290px;overflow:hidden;background:#191919;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif}
  body{display:flex;align-items:center;padding:0 18px;gap:0}
  .ring-wrap{position:relative;width:200px;height:200px;flex-shrink:0}
  .ring-wrap svg{width:200px;height:200px}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-num{font-size:42px;font-weight:800;color:#f0f0f0;line-height:1}
  .score-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.38);margin-top:4px}
  .score-dur{font-size:14px;font-weight:600;color:rgba(255,255,255,0.65);margin-top:6px}
  .stats{flex:1;padding-left:18px}
  .stats-heading{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.35);margin-bottom:13px}
  .stage-row{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .stage-row:last-of-type{margin-bottom:0}
  .swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  .stage-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);width:36px}
  .bar-bg{flex:1;height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden}
  .bar{height:100%;border-radius:3px}
  .stage-val{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);width:48px;text-align:right}
  .divider{height:1px;background:rgba(255,255,255,.08);margin:13px 0}
  .meta{font-size:11.5px;color:rgba(255,255,255,.38);line-height:1.8}
  .meta strong{color:rgba(255,255,255,.6);font-weight:600}
</style></head><body>
<!-- v2 · r=84, C=2pi x 84 approx 527.79 -->
<div class="ring-wrap">
  <svg viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">
    <circle cx="105" cy="105" r="84" fill="none" stroke="#252525" stroke-width="20"/>
    <circle cx="105" cy="105" r="84" fill="none" stroke="#2d7dd2" stroke-width="20"
      stroke-dasharray="75.86 451.93" stroke-dashoffset="0"
      stroke-linecap="butt" transform="rotate(-90 105 105)"/>
    <circle cx="105" cy="105" r="84" fill="none" stroke="#5aaed4" stroke-width="20"
      stroke-dasharray="319.71 208.08" stroke-dashoffset="-75.86"
      stroke-linecap="butt" transform="rotate(-90 105 105)"/>
    <circle cx="105" cy="105" r="84" fill="none" stroke="#94cfe3" stroke-width="20"
      stroke-dasharray="132.22 395.57" stroke-dashoffset="-395.57"
      stroke-linecap="butt" transform="rotate(-90 105 105)"/>
  </svg>
  <div class="ring-center">
    <span class="score-num">100</span>
    <span class="score-label">Sleep Score</span>
    <span class="score-dur">8 h 7 m</span>
  </div>
</div>
<div class="stats">
  <div class="stats-heading">Aug 13 — Last Synced</div>
  <div class="stage-row"><div class="swatch" style="background:#2d7dd2"></div><span class="stage-name">Deep</span><div class="bar-bg"><div class="bar" style="background:#2d7dd2;width:14.4%"></div></div><span class="stage-val">70 min</span></div>
  <div class="stage-row"><div class="swatch" style="background:#5aaed4"></div><span class="stage-name">Light</span><div class="bar-bg"><div class="bar" style="background:#5aaed4;width:60.6%"></div></div><span class="stage-val">4h 55m</span></div>
  <div class="stage-row"><div class="swatch" style="background:#94cfe3"></div><span class="stage-name">REM</span><div class="bar-bg"><div class="bar" style="background:#94cfe3;width:25.1%"></div></div><span class="stage-val">2h 2m</span></div>
  <div class="stage-row"><div class="swatch" style="background:#2a2a2a;border:1px solid #444"></div><span class="stage-name">Awake</span><div class="bar-bg"><div class="bar" style="background:#444;width:1%"></div></div><span class="stage-val">0 min</span></div>
  <div class="divider"></div>
  <div class="meta"><strong>Bed</strong> 11:23 PM &nbsp;·&nbsp; <strong>Wake</strong> 7:29 AM<br><strong>RHR</strong> 54 bpm &nbsp;·&nbsp; <strong>Awakenings</strong> 0</div>
</div>

<button id="rlbtn" title="Reload latest published data" aria-label="Reload">&#8635;</button>
<style>
  body{position:relative}
  #rlbtn{position:absolute;top:9px;right:11px;z-index:20;width:21px;height:21px;
    padding:0;border:0;border-radius:50%;cursor:pointer;font-size:12px;line-height:21px;
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.38);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    transition:background .15s,color .15s}
  #rlbtn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
  #rlbtn.spin{animation:rlspin .7s linear infinite}
  @keyframes rlspin{to{transform:rotate(360deg)}}
</style>
<script>
document.getElementById('rlbtn').addEventListener('click', function () {
  this.classList.add('spin');
  location.replace(location.pathname + '?t=' + Date.now());
});
</script>
</body></html>
